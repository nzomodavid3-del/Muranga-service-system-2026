{% extends "base.html" %}
{% block title %}Sign in | Muranga Service System{% endblock %}
{% block content %}
<div class="form-card"><h1>Welcome back</h1><p class="help">Sign in to manage or track service requests.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required value="{{ request.form.get('email','') }}"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Sign in</button>
</form><p>New to the portal? <a href="{{ url_for('register') }}">Create an account</a>.</p></div>
{% endblock %}
